name: Backfill Missed Predictions

on:
  workflow_dispatch: {}

jobs:
  backfill:
    name: Rattraper les prédictions manquantes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Rejouer predict_v3 sur les jours manqués
        run: python backfill_missed_predictions.py
      - name: Évaluer les prédictions rattrapées
        run: python evaluate_predict_v1.py
